<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventario - NexusStore</title>
    
    <link rel="stylesheet" href="styles.css" />
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

    <style>

        /* Contenedor de usuario en header 
        .user-info {
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: 500;
        }
        */
        
        /* Estilos de Modales (Ventanas emergentes) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            display: none; /* Oculto por defecto */
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: var(--surface-dark);
            padding: 2rem;
            border-radius: var(--card-radius);
            width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        /* Inputs específicos de modales */
        .modal-input {
            background-color: var(--background-dark);
            border: 1px solid var(--border-color);
            color: white;
            padding: 0.5rem;
            border-radius: 6px;
            width: 100%;
        }
        
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="logo">
            <i class="fas fa-cube"></i> Moda en Lino
        </div>
        <ul class="nav-links">
            <!--
            <li>
                <a href="index2.html" class="nav-link">
                    <i class="fas fa-cash-register"></i> Punto de Venta
                </a>
            </li>
            -->

            <li>
                <a href="inventory2.html" class="nav-link active">
                    <i class="fas fa-boxes"></i> Inventario
                </a>
            </li>
            
            <!--
            <li>
                <a href="stats2.html" class="nav-link">
                    <i class="fas fa-chart-line"></i> Estadísticas
                </a>
            </li>
            -->
        </ul>
    </nav>

    <main class="main-content">
        <header>
            <h1>Gestión de Inventario</h1>
            <div style="display: flex; align-items: center; gap: 20px;">
                <div class="user-info">
                    <i class="fas fa-user-circle"></i>
                    <span id="displayUsername">Admin User</span>
                </div>
                <button class="btn btn-primary" onclick="openModal()" style="width: auto; padding: 0.75rem 1.5rem">
                    <i class="fas fa-plus"></i> Nuevo Producto
                </button>
            </div>
        </header>

        <div class="table-container">
            <div style="display: flex; justify-content: space-between; margin-bottom: 1.5rem;">
                <div style="position: relative; width: 300px">
                    <i class="fas fa-search" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                    <input 
                        type="text" 
                        onkeyup="filterTable(this.value)"
                        class="form-control"
                        placeholder="Buscar productos..."
                        style="padding-left: 2.5rem;"
                    />
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Talla</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="inventoryTableBody">
                    <tr><td colspan="5" style="text-align:center; padding: 20px;">Cargando inventario...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <div class="modal-overlay" id="productModal">
        <div class="modal-content">
            <h2 id="modalTitle" style="margin-bottom: 1.5rem;">Nuevo Producto</h2>
            
            <form id="productForm">
                <input type="hidden" id="productId"> 
                
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label>Nombre del Producto</label>
                    <input type="text" id="pName" class="form-control" required placeholder="Ej: Nike Air Max">
                </div>

                <div style="display: flex; gap: 10px; margin-bottom: 1rem;">
                    <div class="form-group" style="flex: 1;">
                        <label>Precio ($)</label>
                        <input type="number" step="0.01" id="pPrice" class="form-control" required placeholder="0.00">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Talla</label>
                        <input type="number" id="pTalla" class="form-control" required placeholder="Ej: 42">
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 1rem;">
                    <label>Stock Disponible</label>
                    <input type="number" id="pStock" class="form-control" required placeholder="0">
                </div>


                <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 2rem;">
                    <button type="button" class="btn" onclick="closeModal('productModal')" style="background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); width: auto;">Cancelar</button>
                    <button type="submit" class="btn btn-primary" style="width: auto;">Guardar Producto</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = '/api/productos'; // ://localhost:8080/api/productos
        
        // Variable global para almacenar los productos cargados y evitar fetchs innecesarios al editar
        let currentProducts = [];

        document.addEventListener('DOMContentLoaded', () => {
            // Aquí puedes agregar validación de login si lo necesitas
            loadInventory();
        });

        // --- 1. CARGAR INVENTARIO (GET) ---
        async function loadInventory() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("Error al obtener datos");
                
                currentProducts = await response.json();
                renderTable(currentProducts);
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('inventoryTableBody').innerHTML = '<tr><td colspan="5" style="text-align:center;">Error de conexión o datos vacíos</td></tr>';
            }
        }

        // --- 2. RENDERIZAR TABLA ---
        function renderTable(products) {
            const tbody = document.getElementById('inventoryTableBody');
            tbody.innerHTML = '';

            if (!products || products.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center">No hay productos registrados.</td></tr>';
                return;
            }
            
            products.forEach(p => {
                // Estado del Stock
                let badgeClass = '';
                let badgeText = '';

                if (p.stock > 5) {
                    badgeClass = 'status-in-stock'; 
                    badgeText = `En Stock`;
                } else {
                    badgeClass = 'status-low';
                    badgeText = p.stock === 0 ? `Agotado` : `Bajo Stock`;
                }

                const row = `
                <tr>
                    <td>
                        <div style="display: flex; align-items: center; gap: 1rem">
                            <span style="font-weight: 500">${p.nombre}</span>
                        </div>
                    </td>
                    <td>${p.talla}</td>
                    <td>$${p.precio.toFixed(2)}</td>
                    <td>
                        <span class="status-badge ${badgeClass}">${p.stock} - ${badgeText}</span>
                    </td>
                    <td>
                        <button onclick="editProduct(${p.id})" title="Editar" style="background:none; border:none; color:var(--text-muted); cursor:pointer; margin-right:0.5rem; font-size: 1.1rem;">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button onclick="deleteProduct(${p.id})" title="Eliminar" style="background:none; border:none; color:var(--danger-color); cursor:pointer; font-size: 1.1rem;">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>`;
                tbody.insertAdjacentHTML('beforeend', row);
            });
        }

        // --- 3. ABRIR MODAL (CREAR) ---
        function openModal() {
            document.getElementById('productModal').style.display = 'flex';
            document.getElementById('productForm').reset();
            document.getElementById('productId').value = '';
            document.getElementById('modalTitle').textContent = 'Nuevo Producto';
        }

        // --- 4. ABRIR MODAL (EDITAR) ---
        window.editProduct = (id) => {
            const p = currentProducts.find(item => item.id === id);
            
            if(p) {
                document.getElementById('productId').value = p.id;
                document.getElementById('pName').value = p.nombre;
                document.getElementById('pPrice').value = p.precio;
                document.getElementById('pTalla').value = p.talla;
                document.getElementById('pStock').value = p.stock;
                

                document.getElementById('modalTitle').textContent = 'Editar Producto';
                document.getElementById('productModal').style.display = 'flex';
            }
        }

        // --- 5. GUARDAR (POST / PUT) ---
        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const id = document.getElementById('productId').value;
            
            // Construimos el objeto exacto que espera tu DTO Java (SolicitudCreacionProducto)
            const payload = {
                nombre: document.getElementById('pName').value,
                precio: parseFloat(document.getElementById('pPrice').value),
                talla: parseInt(document.getElementById('pTalla').value),
                stock: parseInt(document.getElementById('pStock').value)
            };

            // Determinar método y URL
            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/${id}` : API_URL;

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // Como tu backend ahora devuelve ResponseEntity<String> o Map, manejamos ambos
                if(res.ok) {
                    // Cierra modal y recarga tabla
                    closeModal('productModal');
                    loadInventory();
                    
                    // Opcional: Mostrar alerta de éxito
                    // const msg = await res.text(); // o res.json()
                    // alert("Operación exitosa"); 
                } else {
                    const errorJson = await res.json();
                    alert("Error: " + (errorJson.detail || errorJson.mensaje || "Error desconocido"));
                }
            } catch (error) {
                console.error("Error saving:", error);
                alert("Error de conexión con el servidor");
            }
        });

        // --- 6. ELIMINAR (DELETE) ---
        window.deleteProduct = async (id) => {
            if(confirm("¿Estás seguro de eliminar este producto?")) {
                try {
                    const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                    
                    if(res.ok) {
                        loadInventory();
                    } else {
                        alert("No se pudo eliminar el producto.");
                    }
                } catch(e) { console.error(e); }
            }
        }

        // --- UTILIDADES ---
        

        window.filterTable = (text) => {
            document.querySelectorAll('#inventoryTableBody tr').forEach(row => {
                row.style.display = row.innerText.toLowerCase().includes(text.toLowerCase()) ? '' : 'none';
            });
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        window.onclick = (e) => {
            if(e.target.classList.contains('modal-overlay')) {
                e.target.style.display = 'none';
            }
        }
    </script>
</body>
</html>
