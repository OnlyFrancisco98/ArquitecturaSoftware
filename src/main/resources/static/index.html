<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventario</title>

    <link rel="stylesheet" href="styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

    <style>
        /* Estilos mínimos del modal y checkboxes usando las variables de styles.css */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: var(--surface-dark);
            padding: 2rem;
            border-radius: var(--card-radius);
            width: 500px;
            max-width: 95%;
            max-height: 90vh;
            overflow-y: auto;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
        }

        .btn-danger {
            background-color: var(--danger-color, #d9534f);
            color: #fff;
        }

        .row-checkbox, #selectAll {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: var(--primary-color, #435d7d);
        }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="logo">
            <i class="fas fa-cube"></i> Moda en Lino
        </div>
        <ul class="nav-links">
            <li>
                <a href="index.html" class="nav-link active">
                    <i class="fas fa-boxes"></i> Inventario
                </a>
            </li>
        </ul>
    </nav>

    <main class="main-content">
        <header>
            <h1>Gestión de Inventario</h1>
            <div style="display: flex; align-items: center; gap: 12px;">
                <button class="btn btn-danger" onclick="deleteSelected()" style="width: auto; padding: 0.75rem 1.25rem;">
                    <i class="fas fa-minus-circle"></i> Eliminar Seleccionados
                </button>
                <button class="btn btn-primary" onclick="openModal()" style="width: auto; padding: 0.75rem 1.5rem;">
                    <i class="fas fa-plus-circle"></i> Nuevo Producto
                </button>
            </div>
        </header>

        <div class="table-container">
            <div style="display: flex; justify-content: space-between; margin-bottom: 1.5rem;">
                <div style="position: relative; width: 300px;">
                    <i class="fas fa-search" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                    <input
                        type="text"
                        onkeyup="filterTable(this.value)"
                        class="form-control"
                        placeholder="Buscar productos..."
                        style="padding-left: 2.5rem;"
                    />
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th style="width: 40px;">
                            <input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)" title="Seleccionar todo" />
                        </th>
                        <th>ID</th>
                        <th>Producto</th>
                        <th>Talla</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="inventoryTableBody">
                    <tr><td colspan="7" style="text-align: center; padding: 20px;">Cargando inventario...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <div class="modal-overlay" id="productModal">
        <div class="modal-content">
            <h2 id="modalTitle" style="margin-bottom: 1.5rem;">Nuevo Producto</h2>

            <form id="productForm">
                <input type="hidden" id="productId" />

                <div class="form-group" style="margin-bottom: 1rem;">
                    <label>Nombre del Producto</label>
                    <input type="text" id="pName" class="form-control" required placeholder="Ej: Camisa de Lino Blanca" />
                </div>

                <div style="display: flex; gap: 10px; margin-bottom: 1rem;">
                    <div class="form-group" style="flex: 1;">
                        <label>Precio ($)</label>
                        <input type="number" step="0.01" min="0" id="pPrice" class="form-control" required placeholder="0.00" />
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Talla</label>
                        <input type="number" min="0" id="pTalla" class="form-control" required placeholder="Ej: 38" />
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 1rem;">
                    <label>Stock Disponible</label>
                    <input type="number" min="0" id="pStock" class="form-control" required placeholder="0" />
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 2rem;">
                    <button type="button" class="btn" onclick="closeModal()" style="background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); width: auto;">Cancelar</button>
                    <button type="submit" class="btn btn-primary" style="width: auto;">Guardar Producto</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = '/api/productos';
        let currentProducts = [];

        document.addEventListener('DOMContentLoaded', loadInventory);

        async function loadInventory() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Error al obtener datos');

                currentProducts = await response.json();
                renderTable(currentProducts);
                document.getElementById('selectAll').checked = false;
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('inventoryTableBody').innerHTML =
                    '<tr><td colspan="7" style="text-align: center;">Error de conexión o datos vacíos</td></tr>';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function renderTable(products) {
            const tbody = document.getElementById('inventoryTableBody');
            tbody.innerHTML = '';

            if (!products || products.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">No hay productos registrados.</td></tr>';
                return;
            }

            products.forEach(p => {
                let badgeClass = p.stock > 5 ? 'status-in-stock' : 'status-low';
                let badgeText = p.stock > 5 ? 'En Stock' : (p.stock === 0 ? 'Agotado' : 'Bajo Stock');

                const row = `
                <tr>
                    <td>
                        <input type="checkbox" class="row-checkbox" value="${p.id}" onchange="syncSelectAll()" />
                    </td>
                    <td>${p.id}</td>
                    <td>
                        <span style="font-weight: 500;">${escapeHtml(p.nombre)}</span>
                    </td>
                    <td>${p.talla}</td>
                    <td>$${Number(p.precio).toFixed(2)}</td>
                    <td>
                        <span class="status-badge ${badgeClass}">${p.stock} - ${badgeText}</span>
                    </td>
                    <td>
                        <button onclick="editProduct(${p.id})" title="Editar" style="background: none; border: none; color: var(--text-muted); cursor: pointer; margin-right: 0.5rem; font-size: 1.1rem;">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button onclick="deleteProduct(${p.id})" title="Eliminar" style="background: none; border: none; color: var(--danger-color); cursor: pointer; font-size: 1.1rem;">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>`;
                tbody.insertAdjacentHTML('beforeend', row);
            });
        }

        function toggleSelectAll(master) {
            document.querySelectorAll('.row-checkbox').forEach(cb => {
                if (cb.closest('tr').style.display !== 'none') {
                    cb.checked = master.checked;
                }
            });
        }

        function syncSelectAll() {
            const checkboxes = Array.from(document.querySelectorAll('.row-checkbox'))
                .filter(cb => cb.closest('tr').style.display !== 'none');
            const checked = checkboxes.filter(cb => cb.checked);
            document.getElementById('selectAll').checked = checkboxes.length > 0 && checkboxes.length === checked.length;
        }

        async function deleteSelected() {
            const ids = Array.from(document.querySelectorAll('.row-checkbox:checked')).map(cb => cb.value);
            if (ids.length === 0) {
                alert('Selecciona al menos un producto para eliminar.');
                return;
            }
            if (!confirm(`¿Estás seguro de eliminar ${ids.length} producto(s)?`)) return;

            try {
                await Promise.all(ids.map(id => fetch(`${API_URL}/${id}`, { method: 'DELETE' })));
                loadInventory();
            } catch (error) {
                console.error('Error:', error);
                alert('Error al eliminar los productos seleccionados.');
            }
        }

        function openModal() {
            document.getElementById('productForm').reset();
            document.getElementById('productId').value = '';
            document.getElementById('modalTitle').textContent = 'Nuevo Producto';
            document.getElementById('productModal').style.display = 'flex';
        }

        function editProduct(id) {
            const p = currentProducts.find(item => item.id === id);
            if (!p) return;

            document.getElementById('productId').value = p.id;
            document.getElementById('pName').value = p.nombre;
            document.getElementById('pPrice').value = p.precio;
            document.getElementById('pTalla').value = p.talla;
            document.getElementById('pStock').value = p.stock;

            document.getElementById('modalTitle').textContent = 'Editar Producto';
            document.getElementById('productModal').style.display = 'flex';
        }

        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const id = document.getElementById('productId').value;
            const payload = {
                nombre: document.getElementById('pName').value,
                precio: parseFloat(document.getElementById('pPrice').value),
                talla: parseInt(document.getElementById('pTalla').value),
                stock: parseInt(document.getElementById('pStock').value)
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/${id}` : API_URL;

            try {
                const res = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    closeModal();
                    loadInventory();
                } else {
                    const msg = await res.text();
                    alert('Error: ' + msg);
                }
            } catch (error) {
                console.error('Error saving:', error);
                alert('Error de conexión con el servidor');
            }
        });

        async function deleteProduct(id) {
            if (!confirm('¿Estás seguro de eliminar este producto?')) return;
            try {
                const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    loadInventory();
                } else {
                    alert('No se pudo eliminar el producto.');
                }
            } catch (error) {
                console.error(error);
            }
        }

        function filterTable(text) {
            document.querySelectorAll('#inventoryTableBody tr').forEach(row => {
                row.style.display = row.innerText.toLowerCase().includes(text.toLowerCase()) ? '' : 'none';
            });
            syncSelectAll();
        }

        function closeModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        window.onclick = (e) => {
            if (e.target.id === 'productModal') {
                closeModal();
            }
        };
    </script>
</body>
</html>
