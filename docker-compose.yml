services:
  mysql-db:
    image: mysql:8
    container_name: inventario-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inventario_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:

whodb:
    image: clidey/whodb
    ports:
      - "8081:8080"